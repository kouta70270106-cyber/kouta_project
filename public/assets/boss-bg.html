<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>魔王の間 · DOMINVS CAMERA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:750px;height:480px;overflow:hidden;background:#04000a;}
.stage{position:fixed;inset:0;overflow:hidden;}
.map{position:absolute;inset:0;width:100%;height:100%;}
</style>
</head>
<body>
<div class="stage">
  <svg class="map" viewBox="0 0 750 480" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#180010"/>
        <stop offset="55%" stop-color="#0a0008"/>
        <stop offset="100%" stop-color="#030006"/>
      </radialGradient>
      <radialGradient id="circleGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#8B0000" stop-opacity="0.55"/>
        <stop offset="70%" stop-color="#8B0000" stop-opacity="0.1"/>
        <stop offset="100%" stop-color="#8B0000" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="throneGlow" cx="50%" cy="40%" r="60%">
        <stop offset="0%" stop-color="#6a0010" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#6a0010" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
        <stop offset="0%" stop-color="#8B0000" stop-opacity="0"/>
        <stop offset="80%" stop-color="#06000a" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#04000a" stop-opacity="0.85"/>
      </radialGradient>
      <pattern id="stoneTile" x="0" y="0" width="90" height="60" patternUnits="userSpaceOnUse">
        <rect width="90" height="60" fill="#0e0008"/>
        <rect x="1"  y="1"  width="42" height="28" fill="#110009" stroke="#1e0010" stroke-width="0.6"/>
        <rect x="45" y="1"  width="44" height="28" fill="#0f0008" stroke="#1e0010" stroke-width="0.6"/>
        <rect x="1"  y="31" width="44" height="28" fill="#100008" stroke="#1e0010" stroke-width="0.6"/>
        <rect x="47" y="31" width="42" height="28" fill="#120009" stroke="#1e0010" stroke-width="0.6"/>
      </pattern>
      <filter id="redGlow">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
    </defs>

    <!-- ============ 背景 ============ -->
    <rect width="750" height="480" fill="url(#bgGrad)"/>

    <!-- 天井アーチ -->
    <path d="M 0 0 L 100 0 Q 375 -55 650 0 L 750 0 L 750 90 Q 375 35 0 90 Z" fill="#110008"/>
    <path d="M 100 0 Q 375 -55 650 0" fill="none" stroke="#300015" stroke-width="2.5" opacity="0.8"/>
    <path d="M 100 0 Q 375 -45 650 0" fill="none" stroke="#200010" stroke-width="1" opacity="0.5"/>
    <!-- 天井の石ブロック -->
    <line x1="0"   y1="55" x2="750" y2="55" stroke="#1e0010" stroke-width="1" opacity="0.4"/>
    <line x1="150" y1="0"  x2="130" y2="55" stroke="#1e0010" stroke-width="0.8" opacity="0.3"/>
    <line x1="300" y1="0"  x2="280" y2="55" stroke="#1e0010" stroke-width="0.8" opacity="0.3"/>
    <line x1="450" y1="0"  x2="470" y2="55" stroke="#1e0010" stroke-width="0.8" opacity="0.3"/>
    <line x1="600" y1="0"  x2="620" y2="55" stroke="#1e0010" stroke-width="0.8" opacity="0.3"/>

    <!-- 石床 -->
    <rect y="310" width="750" height="170" fill="url(#stoneTile)" opacity="0.85"/>
    <line x1="0" y1="310" x2="750" y2="310" stroke="#350015" stroke-width="1.5" opacity="0.6"/>

    <!-- 床の亀裂 -->
    <path d="M 120 340 L 155 375 L 140 420" stroke="#06000a" stroke-width="2.5" fill="none" opacity="0.9"/>
    <path d="M 157 357 L 175 345" stroke="#06000a" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M 350 320 L 375 355 L 360 395 L 390 440" stroke="#06000a" stroke-width="1.8" fill="none" opacity="0.7"/>
    <path d="M 377 355 L 400 348" stroke="#06000a" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M 580 330 L 560 370 L 590 415" stroke="#06000a" stroke-width="2" fill="none" opacity="0.8"/>

    <!-- 床の魔法陣（中央右） -->
    <g transform="translate(490, 415)">
      <ellipse cx="0" cy="0" rx="140" ry="40" fill="url(#circleGlow)"/>
      <ellipse cx="0" cy="0" rx="105" ry="30" fill="none" stroke="#8B0000" stroke-width="1.2" opacity="0.55"/>
      <ellipse cx="0" cy="0" rx="98"  ry="28" fill="none" stroke="#6a0000" stroke-width="0.5" opacity="0.4"/>
      <!-- 五芒星（楕円に変形） -->
      <polygon points="0,-28 26.6,-8.7 16.5,22.8 -16.5,22.8 -26.6,-8.7"
               fill="none" stroke="#8B0000" stroke-width="1.2" opacity="0.5"
               transform="scale(3.5,1)"/>
      <ellipse cx="0" cy="0" rx="17" ry="5" fill="#8B0000" opacity="0.18"/>
    </g>

    <!-- 左柱 -->
    <g transform="translate(90, 0)">
      <!-- 柱の影 -->
      <rect x="-40" y="0" width="80" height="320" fill="#0a0006" opacity="0.7"/>
      <!-- 柱本体 -->
      <rect x="-28" y="55" width="56" height="260" fill="#1a000d" stroke="#2e0012" stroke-width="1"/>
      <rect x="-26" y="55" width="52" height="260" fill="none" stroke="#120008" stroke-width="3" opacity="0.5"/>
      <!-- 縦の溝 -->
      <line x1="-15" y1="60"  x2="-15" y2="310" stroke="#120008" stroke-width="2" opacity="0.4"/>
      <line x1="0"   y1="60"  x2="0"   y2="310" stroke="#120008" stroke-width="1.5" opacity="0.3"/>
      <line x1="15"  y1="60"  x2="15"  y2="310" stroke="#120008" stroke-width="2" opacity="0.4"/>
      <!-- 柱頭 -->
      <rect x="-38" y="38"  width="76" height="20" fill="#240015" stroke="#3a0018" stroke-width="1"/>
      <rect x="-32" y="55"  width="64" height="4"  fill="#350018"/>
      <!-- 柱台 -->
      <rect x="-38" y="310" width="76" height="20" fill="#240015" stroke="#3a0018" stroke-width="1"/>
      <!-- 柱の亀裂 -->
      <path d="M -5 90 L 3 150 L -2 210" stroke="#120008" stroke-width="1.2" fill="none" opacity="0.6"/>
      <!-- 松明（炎） -->
      <rect x="-5" y="20" width="10" height="20" fill="#3a0015" stroke="#5a0020" stroke-width="0.8"/>
      <ellipse cx="0" cy="18" rx="7" ry="10" fill="#8B0000" opacity="0.7"/>
      <ellipse cx="0" cy="13" rx="5" ry="7"  fill="#cc2200" opacity="0.6"/>
      <ellipse cx="0" cy="8"  rx="3" ry="5"  fill="#ff6600" opacity="0.45"/>
      <!-- 松明の光 -->
      <circle cx="0" cy="13" r="25" fill="#8B0000" opacity="0.07"/>
    </g>

    <!-- 右柱 -->
    <g transform="translate(660, 0)">
      <rect x="-40" y="0" width="80" height="320" fill="#0a0006" opacity="0.7"/>
      <rect x="-28" y="55" width="56" height="260" fill="#1a000d" stroke="#2e0012" stroke-width="1"/>
      <rect x="-26" y="55" width="52" height="260" fill="none" stroke="#120008" stroke-width="3" opacity="0.5"/>
      <line x1="-15" y1="60"  x2="-15" y2="310" stroke="#120008" stroke-width="2" opacity="0.4"/>
      <line x1="0"   y1="60"  x2="0"   y2="310" stroke="#120008" stroke-width="1.5" opacity="0.3"/>
      <line x1="15"  y1="60"  x2="15"  y2="310" stroke="#120008" stroke-width="2" opacity="0.4"/>
      <rect x="-38" y="38"  width="76" height="20" fill="#240015" stroke="#3a0018" stroke-width="1"/>
      <rect x="-32" y="55"  width="64" height="4"  fill="#350018"/>
      <rect x="-38" y="310" width="76" height="20" fill="#240015" stroke="#3a0018" stroke-width="1"/>
      <path d="M 5 110 L -3 170 L 2 230" stroke="#120008" stroke-width="1.2" fill="none" opacity="0.6"/>
      <rect x="-5" y="20" width="10" height="20" fill="#3a0015" stroke="#5a0020" stroke-width="0.8"/>
      <ellipse cx="0" cy="18" rx="7" ry="10" fill="#8B0000" opacity="0.7"/>
      <ellipse cx="0" cy="13" rx="5" ry="7"  fill="#cc2200" opacity="0.6"/>
      <ellipse cx="0" cy="8"  rx="3" ry="5"  fill="#ff6600" opacity="0.45"/>
      <circle cx="0" cy="13" r="25" fill="#8B0000" opacity="0.07"/>
    </g>

    <!-- 玉座（右寄り） -->
    <g transform="translate(510, 90)">
      <!-- 玉座の光 -->
      <ellipse cx="0" cy="150" rx="90" ry="100" fill="url(#throneGlow)"/>
      <!-- 背もたれ -->
      <rect x="-55" y="0"   width="110" height="185" fill="#16000c" stroke="#300015" stroke-width="1.5"/>
      <rect x="-48" y="6"   width="96"  height="173" fill="#12000a" stroke="#200010" stroke-width="0.8"/>
      <!-- 装飾ライン -->
      <rect x="-55" y="0"   width="110" height="5"  fill="#3a001a"/>
      <rect x="-55" y="175" width="110" height="5"  fill="#2e0015"/>
      <!-- 頭頂部の角 -->
      <polygon points="-55,0 -55,-22 -42,-8" fill="#20000e" stroke="#300015" stroke-width="1"/>
      <polygon points="55,0  55,-22  42,-8"  fill="#20000e" stroke="#300015" stroke-width="1"/>
      <!-- 中央の骸骨紋章 -->
      <circle cx="0" cy="55" r="20" fill="#18000c" stroke="#4a001a" stroke-width="1.5"/>
      <circle cx="-6" cy="50" r="4"  fill="#5a001a" opacity="0.9"/>
      <circle cx="6"  cy="50" r="4"  fill="#5a001a" opacity="0.9"/>
      <ellipse cx="0" cy="60" rx="7" ry="4" fill="none" stroke="#5a001a" stroke-width="1.2"/>
      <line x1="-5" y1="62" x2="5" y2="62" stroke="#5a001a" stroke-width="1" opacity="0.7"/>
      <!-- 鎖 -->
      <line x1="-30" y1="0"  x2="-25" y2="-20" stroke="#2a0010" stroke-width="3"  opacity="0.7"/>
      <line x1="30"  y1="0"  x2="25"  y2="-20" stroke="#2a0010" stroke-width="3"  opacity="0.7"/>
      <circle cx="-25" cy="-20" r="4" fill="#2a0010" opacity="0.7"/>
      <circle cx="25"  cy="-20" r="4" fill="#2a0010" opacity="0.7"/>
      <!-- 肘掛け -->
      <rect x="-70" y="120" width="20" height="55" fill="#18000c" stroke="#300015" stroke-width="1"/>
      <rect x="50"  y="120" width="20" height="55" fill="#18000c" stroke="#300015" stroke-width="1"/>
      <rect x="-73" y="115" width="26" height="10" fill="#200010" stroke="#300015" stroke-width="1"/>
      <rect x="47"  y="115" width="26" height="10" fill="#200010" stroke="#300015" stroke-width="1"/>
      <!-- 座面 -->
      <rect x="-70" y="170" width="140" height="18" fill="#1c000e" stroke="#300015" stroke-width="1"/>
      <rect x="-70" y="186" width="140" height="6"  fill="#140009"/>
    </g>

    <!-- 天井から垂れる鎖 -->
    <line x1="230" y1="0" x2="235" y2="130" stroke="#2a0010" stroke-width="3" opacity="0.55"/>
    <circle cx="235" cy="130" r="5" fill="#2a0010" opacity="0.6"/>
    <circle cx="235" cy="118" r="4" fill="#2a0010" opacity="0.5"/>
    <line x1="520" y1="0" x2="515" y2="100" stroke="#2a0010" stroke-width="3" opacity="0.55"/>
    <circle cx="515" cy="100" r="5" fill="#2a0010" opacity="0.6"/>
    <circle cx="515" cy="88"  r="4" fill="#2a0010" opacity="0.5"/>

    <!-- 壁の骸骨装飾（左） -->
    <g transform="translate(220, 155)">
      <circle cx="0" cy="0" r="14" fill="#16000c" stroke="#3a0015" stroke-width="1.5"/>
      <circle cx="-4" cy="-2" r="3" fill="#4a001a" opacity="0.85"/>
      <circle cx="4"  cy="-2" r="3" fill="#4a001a" opacity="0.85"/>
      <path d="M -5 6 Q 0 9 5 6" stroke="#4a001a" stroke-width="1.2" fill="none"/>
      <line x1="-3" y1="7" x2="-1" y2="11" stroke="#4a001a" stroke-width="1" opacity="0.6"/>
      <line x1="3"  y1="7" x2="1"  y2="11" stroke="#4a001a" stroke-width="1" opacity="0.6"/>
    </g>

    <!-- 壁の骸骨装飾（右） -->
    <g transform="translate(530, 140)">
      <circle cx="0" cy="0" r="14" fill="#16000c" stroke="#3a0015" stroke-width="1.5"/>
      <circle cx="-4" cy="-2" r="3" fill="#4a001a" opacity="0.85"/>
      <circle cx="4"  cy="-2" r="3" fill="#4a001a" opacity="0.85"/>
      <path d="M -5 6 Q 0 9 5 6" stroke="#4a001a" stroke-width="1.2" fill="none"/>
      <line x1="-3" y1="7" x2="-1" y2="11" stroke="#4a001a" stroke-width="1" opacity="0.6"/>
      <line x1="3"  y1="7" x2="1"  y2="11" stroke="#4a001a" stroke-width="1" opacity="0.6"/>
    </g>

    <!-- タイトル文字 -->
    <text x="375" y="24" text-anchor="middle"
          font-family="'Cinzel',serif" font-size="15"
          fill="#8B0000" letter-spacing="5" opacity="0.75">DOMINVS · CAMERA</text>
    <line x1="180" y1="29" x2="570" y2="29" stroke="#8B0000" stroke-width="0.7" opacity="0.35"/>
    <text x="375" y="43" text-anchor="middle"
          font-family="'Cinzel',serif" font-size="9.5"
          fill="#5a0015" letter-spacing="4" opacity="0.6">魔 王 の 間</text>

    <!-- 床面ルーン文字（装飾） -->
    <text x="35"  y="472" font-family="'Cinzel',serif" font-size="9"
          fill="#3a0015" opacity="0.45" letter-spacing="2">ᚹ ᚾ ᛁ ᚱ ᛖ ᚷ ᚾ ᛟ</text>
    <text x="590" y="472" font-family="'Cinzel',serif" font-size="9"
          fill="#3a0015" opacity="0.45" letter-spacing="2">ᚹ ᚾ ᛁ ᚱ</text>

    <!-- 床面の赤い霧 -->
    <ellipse cx="375" cy="480" rx="420" ry="60" fill="#8B0000" opacity="0.18"/>
    <ellipse cx="375" cy="475" rx="300" ry="35" fill="#6a0000" opacity="0.12"/>

    <!-- ビネット（周辺減光） -->
    <rect width="750" height="480" fill="url(#vignette)"/>
  </svg>
</div>
</body>
</html>
