/* =========================================================
   迷宮図 / DUNGEON MAP  —  自己完結 (HTML/CSS/SVG のみ)
   ---------------------------------------------------------
   ■ 使い方
     ・このファイルをそのまま開く / iframe で埋め込む
     ・ゲーム画面の背景にするなら下の .stage 要素を
       他ページにコピーし、CSS（このstyle）も移植する
   ■ 動的化（任意）
     ・部屋データは <script> の rooms 配列。st を書き換えると
       見た目が変わる: entrance / seen / current / rumor /
       unseen / boss
     ・踏破路は <polyline class="route"> の points を更新
   ========================================================= */
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{background:#e3d2ac;font-family:'Noto Serif JP',serif;}
.stage{position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(120% 120% at 50% 0%,#efe2c4,#e3d2ac 55%,#d2bd92 100%);}
.stage .grain{position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(120,90,50,.10) 1px,transparent 1px),
                   radial-gradient(rgba(120,90,50,.07) 1px,transparent 1px);
  background-size:5px 5px,9px 9px;background-position:0 0,3px 4px;}
.stage .edge{position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 130px rgba(120,80,40,.45),inset 0 0 26px rgba(90,55,25,.4);}
.map{position:absolute;inset:0;width:100%;height:100%;}
.route{fill:none;stroke:#9c2418;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1.5 9;animation:march 5s linear infinite;}
@keyframes march{to{stroke-dashoffset:-105;}}
.halo{fill:#c0341f;transform-box:fill-box;transform-origin:center;animation:halo 2.4s ease-in-out infinite;}
@keyframes halo{0%,100%{transform:scale(.8);opacity:.12;}50%{transform:scale(1.6);opacity:.42;}}
@media (prefers-reduced-motion:reduce){.route,.halo{animation:none;}}
</style>
